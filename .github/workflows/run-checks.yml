name: Run checks
on: [pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12.0"
      - run: |
          npm ci
          npm run check-format
          npm run lint
          npx tsc --noEmit
          cd files
          npm ci
          npx tsc --noEmit

  analytics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analytics
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: |
          # Run Ruff checks before installing all dependencies
          uv run --locked --only-group dev ruff check .
          uv run --locked --only-group dev ruff format --check .
          uv sync --locked
          uv run --no-sync python -c "import analytics.static_site"
