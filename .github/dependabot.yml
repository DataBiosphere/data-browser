version: 2
updates:
  # Enable version updates for npm, one update per pull request
  - package-ecosystem: "npm"
    # Look for `package.json` and `lock` files in the root project, the
    # `files` scripts, and the GitLab CI generator
    directories:
      - "/"
      - "/files"
      - "/.gitlab"
    # Check the npm registry for updates every month
    schedule:
      interval: "monthly"
    # Propose a version update only once the release is 7 days old;
    # security updates are not delayed
    cooldown:
      default-days: 7
    assignees:
      - "NoopDog"
    open-pull-requests-limit: 50

  # Enable version updates for the analytics Python package, one update per
  # pull request
  - package-ecosystem: "uv"
    # Look for `pyproject.toml` and `uv.lock` in the `analytics` directory
    directory: "/analytics"
    # Check PyPI for updates every month
    schedule:
      interval: "monthly"
    # Propose a version update only once the release is 7 days old;
    # security updates are not delayed
    cooldown:
      default-days: 7
    assignees:
      - "NoopDog"
    open-pull-requests-limit: 50

  # Enable version updates for GitHub Actions, one update per pull request
  - package-ecosystem: "github-actions"
    # Look for workflow files in `.github/workflows`
    directory: "/"
    # Check for action updates every month
    schedule:
      interval: "monthly"
    # Propose a version update only once the release is 7 days old;
    # security updates are not delayed
    cooldown:
      default-days: 7
    assignees:
      - "NoopDog"
    open-pull-requests-limit: 50
